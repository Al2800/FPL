name: Create outstanding GitHub issues from defs

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If true, only print planned creates"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  issues: write

jobs:
  create-issues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      - name: Create issues from .github/issue-defs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 -m scripts.create_github_issues_from_defs --dry-run
          else
            python3 -m scripts.create_github_issues_from_defs
          fi
