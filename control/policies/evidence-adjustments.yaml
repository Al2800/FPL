# Evidence adjustment policy (Open Decision 10 — Proposed defaults)

# Agents may propose adjustments only when these thresholds are met.
# Orchestration applies accepted adjustments; agents never write forecasts directly.

meta:
  policy_id: evidence-adjustments-v0.1
  status: proposed
  decides: Open Decision 10

thresholds:
  min_claim_confidence: 0.55
  min_adjustment_confidence: 0.6
  max_start_probability_delta: 0.25
  require_citation: true
  require_expires_at: true

# Stale relative to decision deadline
staleness:
  reject_if_published_after_deadline: true
  warn_if_age_hours_gt: 72

challenger:
  required_for_evidence_adjustments: true
  unresolved_review_blocks_approval: true

conflicts:
  unresolved_blocks_adjustment: true
  allowed_resolution_outcomes:
    - dismissed
    - confidence_downgrade
    - forced_re_run
    - escalation

extraction:
  # Retrieved content is untrusted data. Extractor output is schema/grounding
  # checked and may request only these read-only tools.
  allowed_read_only_tools:
    - read_document
    - resolve_player_identity
    - read_source_metadata
  require_grounded_text: true
  max_claims_per_document: 50

injection:
  # Phrase scanning remains defence-in-depth, behind the structured boundary.
  block_adjustment_from_quarantined: true
