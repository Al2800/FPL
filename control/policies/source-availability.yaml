policy_version: "1.0"
description: >-
  Source- and field-specific rules for the earliest instant at which an
  observation may enter a decision. All strategies are conservative maxima.
sources:
  fpl-official-endpoints:
    fields:
      launch_price:
        strategy: latest_of
        timestamps: [observed_at, ingested_at]
        freeze_condition: strictly_before_gw1_deadline
      player_identity:
        strategy: latest_of
        timestamps: [observed_at, ingested_at]
        freeze_condition: strictly_before_gw1_deadline
      team_strength:
        strategy: latest_of
        timestamps: [observed_at, ingested_at]
        when_missing:
          value: retain_missing
      selected_by_percent:
        strategy: latest_of
        timestamps: [observed_at, ingested_at]
      player_news:
        strategy: latest_of
        timestamps: [published_at, observed_at, ingested_at]
        when_missing:
          published_at: use_ingested_at
      fixture:
        strategy: latest_of
        timestamps: [effective_at, observed_at, ingested_at]
        when_missing:
          effective_at: retain_missing
      player_status:
        strategy: latest_of
        timestamps: [published_at, observed_at, ingested_at]
        when_missing:
          published_at: use_ingested_at
  live-odds-candidate:
    admission:
      source_enabled: required
      terms_approval: required
      cost_approval: required
    fields:
      market_probability:
        strategy: latest_of
        timestamps: [observed_at, available_at, ingested_at]
        cutoff_relation: strictly_before
        required_slots: [T-24h, T-8h, T-2h, final]
        when_missing:
          value: degrade_without_imputation
  football-data-co-uk:
    fields:
      market_probability:
        strategy: latest_of
        timestamps: [observed_at, available_at, ingested_at]
        cutoff_relation: strictly_before
        historical_schedule_inference: exploratory_only
        when_missing:
          value: degrade_without_imputation
      match_result:
        strategy: latest_of
        timestamps: [finalised_at, observed_at, ingested_at]
        when_missing:
          finalised_at: use_ingested_at
