# Source registry — plan Section 6.2
# No collector may be enabled without a complete entry and resolved licence_status.
# ADR-0001 / ADR-0002: private non-commercial analysis; local retention; no redistribution.

registry_version: "0.2.0"
updated_at: "2026-07-21"

sources:
  - source_id: fpl-official-endpoints
    owner: Premier League / Fantasy Premier League
    source_type: api
    authority: canonical
    terms_url: "https://www.premierleague.com/terms-and-conditions"
    licence_status: restricted
    allowed_use: private_analysis_local_retention_no_redistribution
    authentication: none
    collection_method: api
    expected_cadence: daily_and_pre_deadline
    max_staleness: "6h"
    failure_policy: use_cache_and_report
    retention_policy: local_indefinite_private_per_ADR-0002
    attribution: "Fantasy Premier League (fantasy.premierleague.com)"
    enabled: true
    review_date: "2026-09-01"
    notes: >
      Unofficial/unsupported as a developer API. Endpoints may 404 off-season.
      Capture bootstrap-static and fixtures from day one; event/{gw}/live once live.
      licence_status is restricted (not prohibited): private local snapshots permitted
      under ADR-0001/0002; redistribution is not.
    endpoints:
      - "https://fantasy.premierleague.com/api/bootstrap-static/"
      - "https://fantasy.premierleague.com/api/fixtures/"
      - "https://fantasy.premierleague.com/api/element-summary/{player_id}/"
      - "https://fantasy.premierleague.com/api/event/{gw}/live/"
      - "https://fantasy.premierleague.com/api/entry/{manager_id}/"

