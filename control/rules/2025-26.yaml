# FPL 2025/26 machine-readable rules used by Benchmark v0 historical replay.
# Values are encoded from dated official Premier League material. Historical
# outcomes remain authoritative where Opta/FPL adjudication cannot be replayed.

meta:
  season: "2025-26"
  ruleset_id: "2025-26-v1.0"
  replay_status: validated
  verified_at: "2026-07-22"
  evidence_policy: contemporaneous_official_premier_league
  notes: >
    This catalogue governs Classic FPL only. It excludes FPL Challenge. All
    decision constraints and point values needed by Benchmark v0 are resolved.

