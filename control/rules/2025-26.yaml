bonus:
  - rule_id: bonus.award
    category: bonus
    description: Top BPS positions receive 3, 2 and 1 with official tie handling
    value:
      awards: [3, 2, 1]
      tie_rules:
        - "tie for first: tied leaders get 3 and next distinct rank gets 1"
        - "tie for second: leader gets 3 and tied second get 2"
        - "tie for third: first gets 3, second gets 2 and tied third get 1"
    status: confirmed
    source_url: "https://www.premierleague.com/en/news/4362127/whats-new-in-202526-fantasy-changes-to-bonus-points-system"
    source_published_at: "2025-07-19"
    verified_at: "2026-07-22"
  - rule_id: bonus.bps_2025_26_changes
    category: bonus
    description: BPS metric changes introduced for 2025/26
    value:
      goalkeeper_save_inside_box_bps: 3
      goalkeeper_save_outside_box_bps: 2
      penalty_save_base_bps: 8
      goal_line_clearance_bps: 9
      penalty_goal_bps: 12
      non_penalty_goal_bps: {GKP: 12, DEF: 12, MID: 18, FWD: 24}
      tackle_won_bps: 2
      successful_tackles_net_metric_removed: true
    status: confirmed
    source_url: "https://www.premierleague.com/en/news/4362127/whats-new-in-202526-fantasy-changes-to-bonus-points-system"
    source_published_at: "2025-07-19"
