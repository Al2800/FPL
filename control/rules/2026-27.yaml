# ---------------------------------------------------------------------------
# Defensive contributions
# ---------------------------------------------------------------------------
defensive_contributions:
  - rule_id: defensive_contributions.thresholds
    category: defensive_contributions
    description: Position-specific defensive-contribution thresholds and cap
    value:
      DEF:
        actions: [clearances, blocks, interceptions, tackles]
        threshold: 10
        points: 2
      MID:
        actions: [clearances, blocks, interceptions, tackles, recoveries]
        threshold: 12
        points: 2
      FWD:
        actions: [clearances, blocks, interceptions, tackles, recoveries]
        threshold: 12
        points: 2
      max_points_per_match: 2
      goalkeepers_eligible: false
    status: confirmed
    effective_from: "2026-07-20"
    source_url: "https://www.premierleague.com/en/news/4679873/all-you-need-to-know-about-changes-to-fpl-for-202627"
    secondary_source_url: "https://www.premierleague.com/en/news/2174909/fpl-basics-scoring"
    verified_at: "2026-07-21"
    notes: Confirmed to remain for 2026/27; thresholds inherited from 2025/26 scoring page

# ---------------------------------------------------------------------------
# Bonus / BPS
# ---------------------------------------------------------------------------
bonus:
  - rule_id: bonus.award
    category: bonus
    description: Top three BPS scorers receive 3, 2 and 1 bonus points with stated tie rules
    value:
      awards: [3, 2, 1]
      tie_rules:
        - "tie for first: both get 3, third gets 1"
        - "tie for second: first gets 3, tied get 2 each"
        - "tie for third: first gets 3, second gets 2, tied get 1 each"
    status: inherited
    effective_from: "2026-07-20"
    source_url: "https://www.premierleague.com/en/news/4679946/whats-new-in-202627-fantasy-changes-to-bonus-points-system"
    verified_at: "2026-07-21"
    launch_verification_required: true

  - rule_id: bonus.bps_2026_27_changes
    category: bonus
    description: 2026/27 BPS metric revisions
    value:
      tackled_penalty_removed: true
      cbi_bps_per_n: 3
      gk_any_save_bps: 2
      gk_save_inside_box_extra_bps: 1
      gk_save_outside_box_metric_removed: true
      gk_big_chance_save_extra_bps: 1
      gk_penalty_save_bps: 7
    status: confirmed
    effective_from: "2026-07-20"
    source_url: "https://www.premierleague.com/en/news/4679946/whats-new-in-202627-fantasy-changes-to-bonus-points-system"
    verified_at: "2026-07-21"

  - rule_id: bonus.projected_from_minute
    category: bonus
    description: Projected bonus points appear from approximately 20 minutes into matches
    value:
      approx_minute: 20
    status: confirmed
    effective_from: "2026-07-20"
    source_url: "https://www.premierleague.com/en/news/4679873/all-you-need-to-know-about-changes-to-fpl-for-202627"
    verified_at: "2026-07-21"

