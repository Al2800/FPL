# ---------------------------------------------------------------------------
automatic_substitutions:
  - rule_id: automatic_substitutions.formation_preserving
    category: automatic_substitutions
    description: >
      Non-playing starters are replaced from the ordered bench in a way that
      preserves a legal formation; goalkeeper substitutions are separate
    value:
      formation_preserving: true
      goalkeeper_separate: true
    status: inherited
    effective_from: "2026-07-20"
    source_url: "https://www.premierleague.com/en/news/2174899/fpl-basics-managing-your-team"
    verified_at: "2026-07-21"
    launch_verification_required: true

