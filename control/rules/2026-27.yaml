# ---------------------------------------------------------------------------
# Prices
# ---------------------------------------------------------------------------
prices:
  - rule_id: prices.selling_half_profit
    category: prices
    description: >
      Selling price equals purchase price plus half of any price rise
      (rounded down to the nearest 0.1), or current price if lower than purchase
    value:
      rise_share_kept: 0.5
      round_down_to: 0.1
    status: inherited
    effective_from: "2026-07-20"
    source_url: "https://www.premierleague.com/en/news/2174907"
    verified_at: "2026-07-21"
    launch_verification_required: true

