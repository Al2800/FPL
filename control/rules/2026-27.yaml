# FPL 2026/27 machine-readable rule catalogue
# WP-01. Status values: confirmed | inherited | provisional | disputed | retired
# Rules are data — never hard-code these values into optimiser or agent code.

meta:
  season: "2026-27"
  ruleset_id: "2026-27-v0.1"
  verified_at: "2026-07-21"
  notes: >
    Confirmed items reflect Premier League announcements of July 2026.
    Inherited and provisional items must be re-verified when FPL 2026/27 launches.

