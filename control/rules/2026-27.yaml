    category: chips
    description: Two identical chip sets, one per half-season
    value:
      sets: 2
      chips_per_set: [wildcard, free_hit, triple_captain, bench_boost]
    status: confirmed
    effective_from: "2026-07-20"
    source_url: "https://www.premierleague.com/en/news/4679873/all-you-need-to-know-about-changes-to-fpl-for-202627"
