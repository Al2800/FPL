[project]
name = "fpl-agentic-decision-lab"
version = "0.1.0"
description = "FPL Agentic Decision Laboratory — Phase 0/1 advisory pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "httpx>=0.27",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "duckdb>=1.0",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
fpl-snapshot = "src.ingestion.snapshot_fpl:main"
fpl-skeleton = "src.orchestration.walking_skeleton:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
